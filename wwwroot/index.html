<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Meeting + Remote Support</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #121826; color: #eaf1ff; }
        .container { max-width: 1100px; margin: 0 auto; }
        .layout { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; }
        .panel { background: #1d2738; border: 1px solid #2d3b4f; border-radius: 12px; padding: 16px; }
        .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
        input, button, textarea { border-radius: 8px; border: 1px solid #394f6f; padding: 10px 12px; font-size: 14px; }
        input, textarea { background: #0f1726; color: white; }
        button { background: #2d6cdf; color: white; cursor: pointer; }
        button.secondary { background: #1d4b7d; }
        button.warn { background: #b54141; }
        video { width: 100%; background: #000; border-radius: 10px; border: 1px solid #394f6f; }
        .video-grid { display: grid; grid-template-columns: repeat(2, minmax(250px, 1fr)); gap: 12px; }
        .chat-box { height: 220px; overflow-y: auto; background: #0d1523; border-radius: 8px; padding: 10px; }
        .system { color: #9ecaff; }
        .self { color: #81f2b6; }
        .remote { color: #f0d57d; }
        .status { font-size: 12px; color: #afc4d8; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container">
    <h2>Team Meeting + Remote Support Demo</h2>

    <div class="controls">
        <input id="roomInput" placeholder="Room code" value="demo-room" />
        <input id="nameInput" placeholder="Your name" value="User" />
        <button id="joinBtn">Join Room</button>
        <button id="screenShareBtn" class="secondary">Start Screen Share</button>
        <button id="muteBtn" class="secondary">Mute</button>
        <button id="requestControlBtn" class="secondary">Request Control</button>
        <button id="leaveBtn" class="warn">Leave</button>
    </div>

    <div class="status" id="statusText">Disconnected</div>

    <div class="layout">
        <div class="panel">
            <div class="video-grid">
                <div>
                    <video id="localVideo" autoplay muted playsinline></video>
                </div>
                <div>
                    <video id="remoteVideo" autoplay playsinline></video>
                </div>
            </div>
        </div>

        <div class="panel">
            <h3>Chat</h3>
            <div id="chatBox" class="chat-box" aria-live="polite"></div>
            <div class="controls" style="margin-top: 10px;">
                <textarea id="chatInput" rows="2" style="width: 100%;"></textarea>
            </div>
            <div class="controls">
                <button id="sendChatBtn">Send</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
<script src="app.js"></script>
</body>
</html>
